 return{N,E}}
function draw(l,o={}){const P={};l.N.forEach(n=>P[n.id]=n);const dead=o.dead||[],cut=o.cut||[];

  s+='</g>'});return s+'</svg>'}
function analyze(l,dead,cut){const ty={};l.N.forEach(n=>ty[n.id]=n.t);const adj={};l.N.forEach(n=>adj[n.id]=[]);
 l.E.forEach(([a,b])=>{if(dead.includes(a)||dead.includes(b)||cut.includes(key(a,b)))return;adj[a].push(b);adj[b].push(a)});

function stPop(){if(!STK.length){$('#stm').textContent='⚠️ Stack kosong (underflow), tidak ada yang bisa diambil!';sfx.no();return}const v=STK[STK.length-1];$('#stv').firstChild.classList.add('out');$('#stm').textContent=`pop(): mengambil ${v} dari paling atas (terakhir masuk, pertama keluar).`;sfx.tick();setTimeout(()=>{STK.pop();stD()},400)}
